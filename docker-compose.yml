services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    env_file:
      - .env
    
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: somagoam_redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data 
  web: 
    build: .
    container_name: somagoam_django
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 somagom.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env       
  
    depends_on:
      - db
      - redis

  # celery worker
  celery:
    build: .
    command: celery -A somagom worker -l info
    volumes:
      - .:/app
    env_file:
      - .env       
    depends_on:
      - redis
      - db

  # celery beat
  celery-beat:
    build: .
    command: celery -A somagom beat -l info
    volumes:
      - .:/app

    env_file:
      - .env       
    depends_on:
      - redis
      - db


volumes:
  postgres_data:
  redis_data: